version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: taskforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: taskforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: taskforge-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/taskforge_db?schema=public
      JWT_SECRET: taskforge_super_secure_jwt_secret_key_2026_change_in_production
      JWT_EXPIRES_IN: 1d
      BCRYPT_ROUNDS: 10
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      TRUST_PROXY: "false"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
